<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waysbe Maker — 웨이즈비메이커 링크 모음</title>
<meta name="description" content="Waysbe Maker의 인스타그램, 유튜브, Gumroad, MakerWorld, Cults3D, 3D프린팅 가이드까지 한번에 모아둔 링크 페이지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --paper: #FAFAF7;
    --paper-raised: #FFFFFF;
    --ink: #1C1B1A;
    --ink-soft: #58554E;
    --line: #E4E1D8;
    --ember: #E2622A;
    --ember-soft: #FBE8DE;
    --moss: #4C7A6B;
    --moss-soft: #E4EEEA;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 42px 42px;
    background-position: -1px -1px;
    min-height:100vh;
  }

  @media (prefers-reduced-motion: reduce){
    * { animation: none !important; transition: none !important; }
  }

  h1,h2,h3, .brand{ font-family:'Space Grotesk', sans-serif; }
  .mono{ font-family:'JetBrains Mono', monospace; letter-spacing: 0.02em; }

  a { text-decoration: none; color: inherit; }

  .wrap{
    max-width: 520px;
    margin: 0 auto;
    padding: 48px 20px 64px;
  }

  /* ---- profile header ---- */
  .profile{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom: 32px;
  }
  .avatar{
    width: 84px; height: 84px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--ember), var(--moss));
    color: #fff;
    display:flex; align-items:center; justify-content:center;
    font-size: 26px; font-weight:700;
    font-family:'Space Grotesk', sans-serif;
    box-shadow: 0 6px 18px rgba(28,27,26,0.15);
    margin-bottom: 14px;
  }
  .profile h1{
    font-size: 24px; margin: 0 0 6px;
  }
  .profile p{
    margin:0; color: var(--ink-soft); font-size: 14.5px; line-height:1.5;
    max-width: 360px;
  }

  /* ---- fixed core links ---- */
  .core-links{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 40px;
  }
  .core-link{
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    display:flex;
    align-items:center;
    gap: 10px;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .core-link:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(28,27,26,0.08);
    border-color: var(--ember);
  }
  .core-link svg{ width:20px; height:20px; flex-shrink:0; color: var(--ember); }
  .core-link .core-label{ font-weight:600; font-size: 14.5px; }
  .core-link .core-caption{ font-size: 11.5px; color: var(--ink-soft); margin-top:1px; }
  .core-link.wide{ grid-column: 1 / -1; background: var(--moss-soft); border-color: var(--moss-soft); }
  .core-link.wide svg{ color: var(--moss); }

  /* ---- latest links section ---- */
  .section-label{
    display:flex; align-items:center; gap:8px;
    font-size: 13px; font-weight:600; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing:0.06em;
    margin: 0 0 14px 2px;
  }
  .section-label .dot{ width:7px; height:7px; border-radius:50%; background: var(--ember); }

  .link-list{
    display:flex; flex-direction:column; gap: 10px;
  }
  .link-card{
    background: var(--paper-raised);
    border:1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    display:flex; align-items:center; justify-content:space-between; gap: 12px;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .link-card:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(28,27,26,0.08);
    border-color: var(--ember);
  }
  .link-card .link-text{ min-width:0; }
  .link-card .link-title{ font-weight:600; font-size: 15px; margin:0 0 3px; }
  .link-card .link-desc{ font-size: 12.5px; color: var(--ink-soft); margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .link-card .link-arrow{ flex-shrink:0; color: var(--ember); }
  .link-card .link-arrow svg{ width:18px; height:18px; }

  .empty-note{
    text-align:center; color: var(--ink-soft); font-size:13.5px;
    padding: 24px 0;
  }

  footer{
    text-align:center; margin-top: 48px;
    font-size: 12.5px; color: var(--ink-soft);
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="profile">
    <div class="avatar">WM</div>
    <h1>Waysbe Maker</h1>
    <p>3D프린팅 메이커 웨이즈비예요. 아래에서 원하는 링크를 눌러 들어가세요 🙂</p>
  </div>

  <div class="core-links">
    <a class="core-link" href="https://www.instagram.com/waysbe_maker/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor" stroke="none"></circle></svg>
      <div>
        <div class="core-label">Instagram</div>
        <div class="core-caption">일상 & 신제품 소식</div>
      </div>
    </a>
    <a class="core-link" href="https://youtube.com/@waysbe_maker_youtube" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="4"></rect><path d="M10.5 9.3v5.4l4.7-2.7z" fill="currentColor" stroke="none"></path></svg>
      <div>
        <div class="core-label">YouTube</div>
        <div class="core-caption">튜토리얼 영상</div>
      </div>
    </a>
    <a class="core-link" href="https://alwaysbe.gumroad.com/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l2-5h14l2 5"></path><path d="M3 9h18v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"></path><path d="M8 13a3 3 0 0 0 6 0"></path></svg>
      <div>
        <div class="core-label">Gumroad</div>
        <div class="core-caption">무료·유료 파일</div>
      </div>
    </a>
    <a class="core-link" href="https://makerworld.com/ko/@waysbe" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path><path d="M12 13v8"></path></svg>
      <div>
        <div class="core-label">MakerWorld</div>
        <div class="core-caption">출력 파일 모델</div>
      </div>
    </a>
    <a class="core-link" href="https://cults3d.com/en/users/waysbemaker" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4.5v11L12 22l-8-4.5v-11L12 2z"></path><path d="M12 2v20"></path><path d="M4 6.5l8 4.5 8-4.5"></path></svg>
      <div>
        <div class="core-label">Cults3D</div>
        <div class="core-caption">출력 파일 모델</div>
      </div>
    </a>
    <a class="core-link wide" href="./starter/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      <div>
        <div class="core-label">Waysbe Starter — 3D프린팅 처음 시작하기</div>
        <div class="core-caption">3D프린터 처음 만난 분들을 위한 가이드</div>
      </div>
    </a>
  </div>

  <div class="section-label"><span class="dot"></span>최신 소식 & 링크</div>
  <div class="link-list" id="latest-links">
    <div class="empty-note">불러오는 중…</div>
  </div>

  <footer>
    Waysbe Maker · 3D프린팅 메이커
  </footer>

</div>

<script>
  // ============================================================
  //  최신 소식 / 프로모션 링크 목록은 구글 시트에서 불러옵니다.
  //  waysbe_content_template 시트에서 "카테고리" 열 값이 'm' 인
  //  행들을 시트에 적힌 순서 그대로(위에서 아래) 보여줍니다.
  //  → 순서를 바꾸고 싶으면 시트에서 행을 드래그해서 옮기면 됩니다.
  //  사용하는 열: 카테고리(=m), 제목, 설명, 링크
  // ============================================================
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR6aX1530n2G9UAepQXmsRjPw43E7lyJaMSKKbawUX5KsicN0X7LjlVwC9Gh8RZPSISNVf7p8B1VPQ9/pub?gid=1563310562&single=true&output=csv";

  function escapeHtml(str){
    return String(str || '').replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function renderLatestLinks(rows){
    const list = document.getElementById('latest-links');
    if(!rows.length){
      list.innerHTML = '<div class="empty-note">아직 등록된 소식이 없어요. 곧 업데이트할게요!</div>';
      return;
    }
    list.innerHTML = rows.map(function(row){
      const title = escapeHtml(row['제목'] || '(제목 없음)');
      const desc = escapeHtml(row['설명'] || '');
      const link = row['링크'] || '#';
      return (
        '<a class="link-card" href="' + link + '" target="_blank" rel="noopener">' +
          '<div class="link-text">' +
            '<p class="link-title">' + title + '</p>' +
            (desc ? '<p class="link-desc">' + desc + '</p>' : '') +
          '</div>' +
          '<span class="link-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg></span>' +
        '</a>'
      );
    }).join('');
  }

  async function loadLatestLinks(){
    try{
      const bustCacheUrl = SHEET_CSV_URL + (SHEET_CSV_URL.indexOf('?') === -1 ? '?' : '&') + '_=' + Date.now();
      const res = await fetch(bustCacheUrl, { cache: 'no-store' });
      const csvText = await res.text();
      const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
      const rows = (parsed.data || []).filter(function(row){
        const cat = (row['카테고리'] || '').toString().trim().toLowerCase();
        return cat === 'm';
      });
      renderLatestLinks(rows);
    }catch(err){
      document.getElementById('latest-links').innerHTML = '<div class="empty-note">소식을 불러오지 못했어요. 잠시 후 새로고침해주세요.</div>';
    }
  }

  loadLatestLinks();
</script>

</body>
</html>

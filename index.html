<style>
  :root{
    --paper: #FAFAF7;
    --paper-raised: #FFFFFF;
    --ink: #1C1B1A;
    --ink-soft: #58554E;
    --line: #E4E1D8;
    --ember: #E2622A;
    --ember-soft: #FBE8DE;
    --moss: #4C7A6B;
    --moss-soft: #E4EEEA;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 42px 42px;
    background-position: -1px -1px;
    min-height:100vh;
  }

  @media (prefers-reduced-motion: reduce){
    * { animation: none !important; transition: none !important; }
  }

  h1,h2,h3, .brand{ font-family:'Space Grotesk', sans-serif; }
  .mono{ font-family:'JetBrains Mono', monospace; letter-spacing: 0.02em; }

  a { text-decoration: none; color: inherit; }

  .wrap{
    max-width: 520px;
    margin: 0 auto;
    padding: 48px 20px 64px;
  }

  /* ---- profile header ---- */
  .profile{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom: 32px;
  }
  .avatar-wrap{
    position: relative;
    width: 92px; height: 92px;
    margin-bottom: 20px;
  }
  .logo-circle{
    width: 92px; height: 92px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--ember);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 18px rgba(28,27,26,0.15);
    padding: 12px;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }
  .logo-img{
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .wing{
    position: absolute;
    top: 50%;
    width: 52px; height: 66px;
    transform: translateY(-50%);
    pointer-events: none;
    z-index: 0;
    filter: drop-shadow(0 3px 6px rgba(28,27,26,0.12));
  }
  .wing svg{ width:100%; height:100%; display:block; overflow:visible; }
  .wing-left{ right: 100%; margin-right: -10px; }
  .wing-right{ left: 100%; margin-left: -10px; transform: translateY(-50%) scaleX(-1); }
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .profile p{
    margin:0; color: var(--ink-soft); font-size: 14.5px; line-height:1.6;
    max-width: 360px;
  }

  /* ---- fixed core links ---- */
  .core-links{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 40px;
  }
  .core-link{
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    display:flex;
    align-items:center;
    gap: 10px;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .core-link:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(28,27,26,0.08);
    border-color: var(--ember);
  }
  .core-link svg{ width:20px; height:20px; flex-shrink:0; color: var(--ember); }
  .core-link .core-label{ font-weight:600; font-size: 14.5px; }
  .core-link .core-caption{ font-size: 11.5px; color: var(--ink-soft); margin-top:1px; }
  .core-link.accent{ background: var(--moss-soft); border-color: var(--moss-soft); }
  .core-link.accent svg{ color: var(--moss); }

  /* ---- latest links section ---- */
  .section-label{
    display:flex; align-items:center; gap:9px;
    font-size: 18px; font-weight:700; color: var(--ink);
    font-family:'Space Grotesk', sans-serif;
    margin: 0 0 14px 2px;
  }
  .section-label .dot{ width:9px; height:9px; border-radius:50%; background: var(--ember); flex-shrink:0; }
  .section-label .highlight{
    background: #F5FF3D;
    padding: 2px 6px;
    border-radius: 3px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }

  .link-list{
    display:flex; flex-direction:column; gap: 10px;
  }
  .link-card{
    background: var(--paper-raised);
    border:1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    display:flex; align-items:center; justify-content:space-between; gap: 12px;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .link-card:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(28,27,26,0.08);
    border-color: var(--ember);
  }
  .link-card .link-main{ display:flex; align-items:center; gap:12px; min-width:0; }
  .link-card .link-num{
    flex-shrink:0;
    width:26px; height:26px;
    border-radius:50%;
    background: var(--ember-soft);
    color: var(--ember);
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight:600;
    display:flex; align-items:center; justify-content:center;
  }
  .link-card .link-text{ min-width:0; }
  .link-card .link-title{ font-weight:600; font-size: 15px; margin:0 0 3px; display:flex; align-items:center; gap:5px; }
  .link-card .link-desc{ font-size: 12.5px; color: var(--ink-soft); margin:0; }
  .link-card .link-arrow{ flex-shrink:0; color: var(--ember); }
  .link-card .link-arrow svg{ width:18px; height:18px; }
  .link-card.pinned{ border-color: var(--ember); }
  .link-card .pin-badge{
    flex-shrink:0; display:inline-flex; align-items:center;
    color: var(--ember);
  }
  .link-card .pin-badge svg{ width:12px; height:12px; }

  .empty-note{
    text-align:center; color: var(--ink-soft); font-size:13.5px;
    padding: 24px 0;
  }

  .pagination{
    display:flex; align-items:center; justify-content:center;
    gap: 6px; margin-top: 16px; flex-wrap: wrap;
  }
  .page-btn{
    min-width: 30px; height: 30px; padding: 0 6px;
    border-radius: 8px; border: 1px solid var(--line);
    background: var(--paper-raised); color: var(--ink-soft);
    font-family:'JetBrains Mono', monospace; font-size: 12.5px;
    cursor: pointer; transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .page-btn:hover:not(:disabled){ border-color: var(--ember); color: var(--ink); }
  .page-btn.active{ background: var(--ember); border-color: var(--ember); color: #fff; font-weight:600; }
  .page-btn:disabled{ opacity: 0.35; cursor: default; }

  footer{
    text-align:center; margin-top: 20px;
    font-size: 12.5px; color: var(--ink-soft);
  }

  .visitor-stats{
    display:flex; align-items:center; justify-content:center;
    gap: 18px;
    margin-top: 40px;
  }
  .stat-item{
    display:flex; flex-direction:column; align-items:center; gap: 2px;
  }
  .stat-item .stat-num{
    font-size: 17px; font-weight:600; color: var(--ink);
  }
  .stat-item .stat-label{
    font-size: 11px; color: var(--ink-soft);
  }
  .stat-divider{
    width:1px; height: 26px; background: var(--line);
  }
</style>

<script>
  // ============================================================
  //  최신 소식 / 프로모션 링크 목록은 구글 시트 전용 탭에서
  //  불러옵니다. 시트에 "가장 나중에 추가한 행"이 맨 위에 오도록
  //  순서를 뒤집어 보여줍니다 (= 새 글을 시트 맨 아래에 추가하면
  //  자동으로 목록 맨 위에 뜸). 번호는 시트 맨 위 행(가장 오래된
  //  글)이 1번이 되는 고유번호라, 새 글이 추가돼도 기존 글의
  //  번호는 바뀌지 않습니다.
  //  사용하는 열: 제목, 설명, 링크, (4번째 열=고정여부, 이름은
  //  아무거나 상관없고 위치만 4번째면 됨) — 이 열에 "고정"이라고
  //  적으면 그 글은 항상 목록 맨 위 구역에 고정됩니다. 고정 글이
  //  여러 개면 번호가 큰(=더 최근에 등록된) 글이 더 위로 갑니다.
  //  아무것도 안 쓰면 평소처럼 최신순으로 섞입니다.
  // ============================================================
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR6aX1530n2G9UAepQXmsRjPw43E7lyJaMSKKbawUX5KsicN0X7LjlVwC9Gh8RZPSISNVf7p8B1VPQ9/pub?gid=22051895&single=true&output=csv";
  const PAGE_SIZE = 20;
  let allLatestRows = [];
  let currentPage = 1;

  function escapeHtml(str){
    return String(str || '').replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function renderLatestLinks(rows){
    const list = document.getElementById('latest-links');
    if(!rows.length){
      list.innerHTML = '<div class="empty-note">아직 등록된 소식이 없어요. 곧 업데이트할게요!</div>';
      return;
    }
    list.innerHTML = rows.map(function(row){
      const title = escapeHtml(row['제목'] || '(제목 없음)');
      const desc = escapeHtml(row['설명'] || '');
      const link = row['링크'] || '#';
      const num = row.__num < 10 ? '0' + row.__num : String(row.__num);
      const pinBadge = row.__pinned ? '<span class="pin-badge" title="고정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg></span>' : '';
      return (
        '<a class="link-card' + (row.__pinned ? ' pinned' : '') + '" href="' + link + '" target="_blank" rel="noopener">' +
          '<div class="link-main">' +
            '<span class="link-num mono">' + num + '</span>' +
            '<div class="link-text">' +
              '<p class="link-title">' + pinBadge + title + '</p>' +
              (desc ? '<p class="link-desc">' + desc + '</p>' : '') +
            '</div>' +
          '</div>' +
          '<span class="link-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg></span>' +
        '</a>'
      );
    }).join('');
  }

  function renderPagination(){
    const el = document.getElementById('latest-pagination');
    const totalPages = Math.ceil(allLatestRows.length / PAGE_SIZE);
    if(totalPages <= 1){ el.innerHTML = ''; return; }

    let html = '<button type="button" class="page-btn" onclick="goToLatestPage(' + (currentPage - 1) + ')"' + (currentPage === 1 ? ' disabled' : '') + '>‹</button>';
    for(let p = 1; p <= totalPages; p++){
      html += '<button type="button" class="page-btn' + (p === currentPage ? ' active' : '') + '" onclick="goToLatestPage(' + p + ')">' + p + '</button>';
    }
    html += '<button type="button" class="page-btn" onclick="goToLatestPage(' + (currentPage + 1) + ')"' + (currentPage === totalPages ? ' disabled' : '') + '>›</button>';
    el.innerHTML = html;
  }

  function goToLatestPage(page){
    const totalPages = Math.ceil(allLatestRows.length / PAGE_SIZE);
    if(page < 1 || page > totalPages) return;
    currentPage = page;
    const start = (page - 1) * PAGE_SIZE;
    renderLatestLinks(allLatestRows.slice(start, start + PAGE_SIZE));
    renderPagination();
    document.getElementById('latest-links').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  async function loadLatestLinks(){
    try{
      const bustCacheUrl = SHEET_CSV_URL + (SHEET_CSV_URL.indexOf('?') === -1 ? '?' : '&') + '_=' + Date.now();
      const res = await fetch(bustCacheUrl, { cache: 'no-store' });
      const csvText = await res.text();
      const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
      const filtered = (parsed.data || []).filter(function(row){
        return (row['제목'] || '').toString().trim() !== '';
      });
      // 번호는 시트의 절대 위치를 기준으로 매겨서(맨 아래 행=1번),
      // 새 글이 추가돼도 기존 글의 번호는 바뀌지 않도록 합니다.
      // 4번째 열(이름 상관없이 위치로 판단)에 "고정"이라고 쓰면
      // 그 글은 목록 맨 위 구역에 고정됩니다. 고정 글이 여러 개면
      // 번호가 큰(=더 최근) 글이 더 위로 갑니다.
      filtered.forEach(function(row, idx){
        row.__num = idx + 1;
        const keys = Object.keys(row);
        const pinCol = keys.length > 3 ? keys[3] : null;
        const pinVal = pinCol ? (row[pinCol] || '').toString().trim() : '';
        row.__pinned = pinVal === '고정';
      });
      const newestFirst = filtered.reverse();
      const pinnedRows = newestFirst.filter(function(row){ return row.__pinned; });
      const normalRows = newestFirst.filter(function(row){ return !row.__pinned; });
      allLatestRows = pinnedRows.concat(normalRows);
      currentPage = 1;
      renderLatestLinks(allLatestRows.slice(0, PAGE_SIZE));
      renderPagination();
    }catch(err){
      document.getElementById('latest-links').innerHTML = '<div class="empty-note">소식을 불러오지 못했어요. 잠시 후 새로고침해주세요.</div>';
    }
  }

  loadLatestLinks();

  // ============================================================
  //  방문자 카운터 (무료 카운터 API, 별도 가입/서버 불필요)
  //  "오늘" 카운터는 날짜별로 다른 키(todayKey)를 써서, 한국 시간
  //  자정이 지나면 새 키로 자동 전환돼요 — hitscounter.dev 서버가
  //  자체적으로 갖고 있는 "오늘" 집계(UTC 자정 기준, 즉 한국 시간
  //  오전 9시에 리셋됨)에 의존하지 않기 위한 방식입니다.
  //  그래서 오늘/누적 두 값 모두, 각 키의 "총 히트수"(뱃지에서
  //  "/" 뒤에 나오는 두 번째 숫자)를 읽어와야 정확해요.
  // ============================================================
  (function(){
    function pad(n){ return n < 10 ? '0' + n : '' + n; }
    const now = new Date();
    const todayKey = 'waysbemaker-com-' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate());
    const totalKey = 'waysbemaker-com-total';

    function setStat(id, value){
      const el = document.getElementById(id);
      if(!el) return;
      el.textContent = (typeof value === 'number' && !isNaN(value)) ? value.toLocaleString('ko-KR') : '–';
    }

    function hit(key){
      const url = 'https://hitscounter.dev/api/hit?url=' + encodeURIComponent(key) + '&label=visits';
      return fetch(url, { mode: 'cors', cache: 'no-store' })
        .then(function(r){ return r.text(); })
        .then(function(svgText){
          // aria-label 형식: "visits: {오늘 히트} / {총 히트}"
          // 두 번째 숫자(총 히트)를 가져와야 리셋 없이 정확한 값이 나옵니다.
          const m = svgText.match(/aria-label="[^:]*:\s*[\d,]+\s*\/\s*([\d,]+)/);
          return m ? parseInt(m[1].replace(/,/g, ''), 10) : NaN;
        });
    }

    hit(todayKey).then(function(v){ setStat('stat-today', v); }).catch(function(){ setStat('stat-today', null); });
    hit(totalKey).then(function(v){ setStat('stat-total', v); }).catch(function(){ setStat('stat-total', null); });
  })();
</script>
